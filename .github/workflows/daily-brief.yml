name: Daily Brief

# Builds the day's simplified VC / startup / finance news brief and commits it.
# Vercel sees the new commit and redeploys the site automatically.

on:
  schedule:
    # Times are UTC. 01:15 UTC = 06:45 AM India time (main run).
    # The two later runs are backups: they do nothing if today's brief already exists,
    # and retry if the AI was too busy earlier. GitHub may start runs a few minutes late.
    - cron: "15 1 * * *"   # 06:45 IST
    - cron: "45 2 * * *"   # 08:15 IST, backup
    - cron: "15 4 * * *"   # 09:45 IST, backup
  # Lets you run it by hand: GitHub → Actions → Daily Brief → Run workflow
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's brief even if it already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the website code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build today's brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python scripts/news/build_brief.py --force
          else
            python scripts/news/build_brief.py
          fi

      - name: Save the brief to the repo
        id: commit
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/news
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Daily Brief: $(TZ=Asia/Kolkata date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "Push failed, retrying ($i)…"; sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Optional backup: if you add a Vercel Deploy Hook URL as the secret
      # VERCEL_DEPLOY_HOOK, the site is redeployed even if Vercel ignores bot commits.
      - name: Trigger Vercel deploy (optional)
        if: steps.commit.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" > /dev/null && echo "Vercel deploy triggered."
          else
            echo "No deploy hook set; relying on Vercel's GitHub integration."
          fi
